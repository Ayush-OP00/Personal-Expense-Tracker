{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#0d6efd">

    <meta name="application-name" content="Expense Tracker">

    <meta name="apple-mobile-web-app-title" content="Expense Tracker">

    <meta name="description" content="A modern personal expense tracking application built using Django and Bootstrap.">

    <meta name="color-scheme" content="light dark">

        <!-- Favicons -->

    <link rel="icon" type="image/x-icon" href="{% static 'images/branding/favicon.ico' %}">

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/branding/favicon-32x32.png' %}">

    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/branding/favicon-16x16.png' %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/branding/apple-touch-icon.png' %}">

    <link rel="manifest"
      href="{% static 'images/branding/site.webmanifest' %}">

    <title>
        {% block title %}
        Expense Tracker | Personal Finance
        {% endblock %}
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

</head>

<body>

    {% include 'includes/navbar.html' %}

    <div class="container-fluid p-0">

        <div class="row g-0">

            {% include 'includes/sidebar.html' %}

            <main class="col-lg-10 col-md-9 content-area">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="{% static 'js/main.js' %}"></script>

    <script src="{% static 'js/charts.js' %}"></script>

    <script src="{% static 'js/filters.js' %}"></script>

    <script src="{% static 'js/toasts.js' %}"></script>

    <script src="{% static 'js/loading.js' %}"></script>

    {% include 'includes/toasts.html' %}

</body>

</html>
