{% extends 'base.html' %}

{% block title %}
Edit Expense | Expense Tracker
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8 col-xl-7">

            <div class="card shadow-sm border-0 rounded-4 edit-card">

                <div class="card-body p-5">

                    <div class="d-flex justify-content-between align-items-center mb-4">

                        <div>

                            <h2 class="fw-bold mb-1">
                                ✏ Edit Expense
                            </h2>

                            <p class="text-muted mb-0">
                                Update your expense details.
                            </p>

                        </div>

                        <a href="{% url 'manage' %}" class="btn btn-outline-secondary">

                            ← Back

                        </a>

                    </div>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="row g-4">

                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Expense Title
                                </label>

                                <input type="text" name="title" class="form-control" autocomplete="off" value="{{ expense.title }}"
                                    required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Amount
                                </label>

                                <input type="number" name="amount" class="form-control" autocomplete="off" value="{{ expense.amount }}"
                                    step="0.01" min="0" required>

                            </div>

                            <div class="col-md-6">

                                <label class="form-label fw-semibold">
                                    Category
                                </label>

                                <select name="category" class="form-select" required>

                                    <option value="Food" {% if expense.category == "Food" %}selected{% endif %}>
                                        Food
                                    </option>

                                    <option value="Transport" {% if expense.category == "Transport" %}selected{% endif %}>
                                        Transport
                                    </option>

                                    <option value="Shopping" {% if expense.category == "Shopping" %}selected{% endif %}>
                                        Shopping
                                    </option>

                                    <option value="Bills" {% if expense.category == "Bills" %}selected{% endif %}>
                                        Bills
                                    </option>

                                    <option value="Other" {% if expense.category == "Other" %}selected{% endif %}>
                                        Other
                                    </option>

                                </select>

                            </div>

                            <div class="col-12">

                                <label class="form-label fw-semibold">
                                    Date
                                </label>

                                <input type="date" name="date" class="form-control"
                                    value="{{ expense.date|date:'Y-m-d' }}" required>

                            </div>

                        </div>

                        <hr class="my-5">

                        <div class="d-flex justify-content-end gap-3">

                            <a href="{% url 'manage' %}" class="btn btn-outline-secondary px-4">

                                Discard

                            </a>

                            <button type="submit" class="btn btn-primary px-4">

                                <i class="bi bi-check-circle me-2"></i>

                                Save Changes

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
