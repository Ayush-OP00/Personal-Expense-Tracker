<!-- Expense Table -->

<h2>Your Expenses</h2>

{% if expenses %}

<table>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Amount</th>
        <th>Category</th>
        <th>Date</th>
        <th>Action</th>
    </tr>

    {% for expense in expenses %}
    <tr>
        <td>{{ expense.id }}</td>
        <td>{{ expense.title }}</td>
        <td>{{ expense.amount }}</td>
        <td>{{ expense.category }}</td>
        <td>{{ expense.date }}</td>

        <td>
            <a href="{% url 'edit_expense' expense.id %}" 
            class="btn btn-warning btn-sm">
            
            Edit

            </a>

            <form action="{% url 'delete_expense' expense.id %}" method="POST">
                {% csrf_token %}
                <button >

                    Delete
                    
                </button>
            </form>
        </td>
    </tr>
    {% endfor %}

</table>

{% else %}

<p>No expenses added yet.</p>

{% endif %}
