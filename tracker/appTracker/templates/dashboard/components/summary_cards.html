<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary Cards</title>
</head>
<body>
    <div class="row mb-4">

    <div class="col-lg-3 col-md-6 mb-3">

        <div class="summary-card income-card">

            <div class="icon">
                💰
            </div>

            <h6>Total Income</h6>

            <h3>

                ₹{{ total_income }}

            </h3>

        </div>

    </div>

    <div class="col-lg-3 col-md-6 mb-3">

        <div class="summary-card expense-card">

            <div class="icon">
                💸
            </div>

            <h6>Total Expense</h6>

            <h3>

                ₹{{ total_expense }}

            </h3>

        </div>

    </div>

    <div class="col-lg-3 col-md-6 mb-3">

        <div class="summary-card balance-card">

            <div class="icon">
                🏦
            </div>

            <h6>Balance</h6>

            <h3>

                ₹{{ balance }}

            </h3>

        </div>

    </div>

    <div class="col-lg-3 col-md-6 mb-3">

        <div class="summary-card transaction-card">

            <div class="icon">
                📋
            </div>

            <h6>Transactions</h6>

            <h3>

                {{ transaction_count }}

            </h3>

        </div>

    </div>

</div>
</body>
</html>
