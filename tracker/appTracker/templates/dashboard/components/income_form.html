<div class="card shadow-sm border-0 rounded-4">

    <div class="card-body">

        <h4 class="mb-4">

            Total Income

        </h4>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Enter Income

                </label>

                <input
                    type="number"
                    name="income"
                    class="form-control"
                    step="0.01"
                    min="0"
                    required
                >

            </div>

            <button
                class="btn btn-success w-100"
                name="income_submit">

                Save Income

            </button>

        </form>

    </div>

</div>
