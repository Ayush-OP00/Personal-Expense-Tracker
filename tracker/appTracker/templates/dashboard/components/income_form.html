<div class="card shadow-sm border-0 rounded-4">

    <div class="card-body">

        <h4 class="fw-bold mb-1">
            <i class="bi bi-wallet2 me-2"></i>
            Add Income
        </h4>

        <p class="text-muted mb-0">
            Record your latest income.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">

                    Enter Income

                </label>

                <input type="number" name="income" class="form-control" placeholder="e.g. 15000" step="0.01" min="0" required>

            </div>

            <button class="btn btn-success w-100" name="income_submit">

                <i class="bi bi-wallet2 me-2"></i>

                Save Income

            </button>

        </form>

    </div>

</div>
