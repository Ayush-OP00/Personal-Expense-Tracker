<h2>Set Your Total Income</h2>

<form action="" method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">
            Enter Total Income
        </label>

        <input
            type="number"
            class="form-control"
            name="income"
            step="0.01"
            min="0"
            required
        >
    </div>

    <button
        class="btn btn-success"
        type="submit"
        name="income_submit">

        Save Income

    </button>

</form>

<div class="mt-3">

    <h5>

        Total Income:
        <span class="text-success">

            ₹{{ total_income }}

        </span>

    </h5>

</div>

<hr>
