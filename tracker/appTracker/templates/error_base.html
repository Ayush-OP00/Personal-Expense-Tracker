{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <meta name="application-name" content="Expense Tracker">
    <meta name="apple-mobile-web-app-title" content="Expense Tracker">
    <meta name="description" content="A modern personal expense tracking application built using Django and Bootstrap.">

    {% load static %}

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">

    <!-- Favicons -->

    <link rel="icon" type="image/x-icon" href="{% static 'images/branding/favicon.ico' %}">

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/branding/favicon-32x32.png' %}">

    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/branding/favicon-16x16.png' %}">

    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'images/branding/apple-touch-icon.png' %}">

    <link rel="manifest"
      href="{% static 'images/branding/site.webmanifest' %}">

    <title>
        {% block title %}{% endblock %}
    </title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Your CSS -->

    <link rel="stylesheet" href="{% static 'css/main.css' %}">

</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex flex-column">

        <header class="py-4">

            <div class="text-center py-4">

                <img src="{% static 'images/branding/logo.png' %}" alt="Expense Tracker Logo" width="70" height="70"
                    class="mb-3 rounded-4 shadow-sm">

                <h2 class="fw-bold">
                    Expense Tracker
                </h2>

            </div>

        </header>

        <main class="flex-grow-1 d-flex align-items-center justify-content-center">

            {% block content %}
            {% endblock %}

        </main>

        <footer class="text-center py-4 text-muted">

            © 2026 Expense Tracker • Built with Django & Bootstrap

        </footer>

    </div>

</body>

</html>
